<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Willekeurige Berichten met Video</title>
    <style>
        /* Zorg dat het scherm exact beeldvullend is zonder schuifbalken */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* De video op de achtergrond */
        #achtergrondVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Vult het hele scherm zonder de video te vervormen */
            z-index: 1;        /* Laag 1: Achtergrond */
        }

        /* De willekeurige tekst op de voorgrond */
        #scherm {
            position: relative;
            z-index: 2;        /* Laag 2: Bovenop de video */
            font-family: "Courier New", Courier, monospace;
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            
            /* Een subtiele schaduw zorgt dat de tekst op elke video leesbaar blijft */
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
            display: block;    /* Direct zichtbaar */
        }
    </style>
</head>
<body>

    <!-- Achtergrondvideo (autoplay, muted en loop zorgen dat hij direct start en herhaalt) -->
    <video id="achtergrondVideo" autoplay muted loop playsinline></video>

    <!-- Tekst op de voorgrond -->
    <div id="scherm">Laden...</div>

    <script>
        // --- PAS HIER JE BESTANDSNAMEN AAN ---
        const VIDEO_BESTAND = "video.MP4";
        const TEKST_BESTAND = "basiswoorden.txt";
        // ------------------------------------

        let woorden = [];
        let intervalId = null;

        const videoElement = document.getElementById("achtergrondVideo");
        const schermElement = document.getElementById("scherm");

        // 1. Stel de video in en speel af
        videoElement.src = VIDEO_BESTAND;

        // 2. Laad de woordenlijst automatisch in bij het openen van de pagina
        fetch(TEKST_BESTAND)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Kan het tekstbestand niet vinden.");
                }
                return response.text();
            })
            .then(tekst => {
                // Splits de tekst per regel en verwijder lege regels
                woorden = tekst.split(/\r?\n/).filter(woord => woord.trim() !== "");
                
                if (woorden.length > 0) {
                    toonBericht();
                    intervalId = setInterval(toonBericht, 3000);
                } else {
                    schermElement.textContent = "Het tekstbestand is leeg.";
                }
            })
            .catch(error => {
                console.error("Fout bij laden:", error);
                schermElement.textContent = "Fout bij laden van " + TEKST_BESTAND;
            });

        function toonBericht() {
            const randomIndex = Math.floor(Math.random() * woorden.length);
            schermElement.textContent = "dit is geen " + woorden[randomIndex];
        }
    </script>

</body>
</html>
